services:
  postgres:
    image: postgres:15.19-alpine3.24
    environment:
      POSTGRES_DB: authserver
      POSTGRES_USER: authserver
      POSTGRES_PASSWORD: local-auth-password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authserver -d authserver"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-postgres:
